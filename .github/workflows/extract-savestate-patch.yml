name: extract-enhanced-patch
on: workflow_dispatch
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Enhanced + upstream
        run: |
          git remote add enh https://github.com/mohawku-bit/Vita3K-Enhanced-Unofficial.git
          git remote add up https://github.com/Vita3K/Vita3K.git
          git fetch enh master
          git fetch up master
      - name: Generate diff vs upstream base
        run: |
          mkdir out
          BASE=496939b602703951277263c7b3e60a9ae36879c1
          git diff --stat $BASE enh/master > out/diffstat.txt
          git diff --name-status $BASE enh/master > out/files.txt
          git diff --binary $BASE enh/master -- . ':!.github' ':!_readme' ':!docs' > out/enhanced-full.patch
      - name: Dry-run apply on this branch
        run: |
          git config user.email ci@example.com
          git config user.name ci
          git apply --reject --whitespace=nowarn out/enhanced-full.patch 2> out/apply-log.txt || true
          find . -name '*.rej' -not -path './.git/*' > out/rejected-files.txt
          mkdir -p out/rej && while read f; do cp --parents "$f" out/rej/; done < out/rejected-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: enhanced-patch
          path: out/
